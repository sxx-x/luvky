# Build a linux/amd64 image and push it to GHCR.
#
# Package visibility cannot be changed from this workflow. GitHub's Packages
# REST API only lists, deletes, and restores packages; it has no endpoint to
# set visibility, and GITHUB_TOKEN cannot do it either. A new GHCR package is
# private. After the first successful push, make it public so Sealos App
# Launchpad can pull ghcr.io/sxx-x/luvky:latest without credentials:
#   1. Open https://github.com/sxx-x/luvky/pkgs/container/luvky
#      (or https://github.com/users/sxx-x/packages/container/package/luvky)
#   2. Package settings
#   3. Danger Zone → Change visibility → Public
#   4. Type the package name luvky and confirm
# Public is permanent; a public package cannot be made private again.

name: Publish GHCR image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/sxx-x/luvky:latest
            ghcr.io/sxx-x/luvky:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sxx-x/luvky
            org.opencontainers.image.url=https://github.com/sxx-x/luvky
            org.opencontainers.image.title=luvky
            org.opencontainers.image.description=Listen-together podcast web app
            org.opencontainers.image.licenses=MIT
